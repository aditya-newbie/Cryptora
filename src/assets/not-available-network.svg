<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="surface" x1="104" y1="70" x2="408" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#302B50"/>
      <stop offset="1" stop-color="#17152D"/>
    </linearGradient>
    <linearGradient id="rim" x1="90" y1="88" x2="422" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8B9FF"/>
      <stop offset="0.52" stop-color="#9D8BE8"/>
      <stop offset="1" stop-color="#7665C4"/>
    </linearGradient>
    <linearGradient id="letter" x1="176" y1="170" x2="344" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0EBFF"/>
      <stop offset="1" stop-color="#C8BDF5"/>
    </linearGradient>
    <filter id="softShadow" x="20" y="20" width="472" height="472" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Restrained outer glow keeps the silhouette clear at small sizes. -->
  <circle cx="256" cy="256" r="218" stroke="#9C8BE8" stroke-opacity="0.16" stroke-width="22"/>
  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="211" fill="url(#surface)"/>
    <circle cx="256" cy="256" r="211" stroke="url(#rim)" stroke-width="7"/>
    <circle cx="256" cy="256" r="199" stroke="#E7DFFF" stroke-opacity="0.07" stroke-width="1.5"/>
  </g>

  <text x="256" y="279"
        fill="url(#letter)"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="126" font-weight="650" letter-spacing="-7"
        text-anchor="middle" dominant-baseline="middle">N/A</text>
</svg>
